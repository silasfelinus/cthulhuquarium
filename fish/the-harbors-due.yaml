  charlotte: >-
    Tall, blue-edged, and wonderfully persistent. It is always there for you,
    leaning in so attentively. Some creatures you keep; this one keeps you.
  wilbur: >-
    Put its tank where you can see it from the door, and leave that light on. Feed
    it face to face, then back out. Turn round in the corridor.
