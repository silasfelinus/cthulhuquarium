voices:
  charlotte: >-
    The leading role, and it knows it. Violet and gold, fins flung wide, never a
    moment off the stage. Applaud if you like; it's quite used to it.
  wilbur: >-
    It won't stop for feeding, so drop the food into its path and let it take it
    mid-scene. Never call it by the old name, even by accident.
