art_prompt: >
  a broad crab with tally-mark scratches carved across its shell, one claw raised mid-
  count, brick red and cream, stalked eyes fixed forward, chromolithograph cigarette
  card from around 1900, small format with a printed ornamental border and a blank name
  banner, four-colour stone printing, visible misregistration and dot rosettes, slightly
  garish cheap inks, corners worn round, unpeopled frame, the name banner empty
sprite:
  motion: breathe
  prompt: >
    a crab whose broad shell is covered in black tally marks, rows of four upright
    strokes crossed by a fifth diagonal stroke, drawn boldly across the whole back of
    the shell like a prisoner counting days on a wall, a single broad crab seen from the
    front, one claw raised mid-count, brick red and cream shell, stalked eyes fixed
    forward, legs braced out to both sides, chromolithograph cigarette card print, bold
    flat inks with slight misregistration on the body, isolated on a plain flat pale
    grey studio backdrop, even soft light, strong crisp silhouette
voices:
  charlotte: >-
    A born bookkeeper, darling. The most scrupulous accounts in the building, and you will never lose track of anything again.
  wilbur: >-
    Let it finish tapping before you feed it, or it starts the count over. Never house it with the Bailiff Eel; it counts the eel, and the eel minds.
