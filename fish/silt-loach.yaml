  prompt: >
    a single long slim loach in strict side profile facing right, whole body visible, sludge-brown and ochre with umber mottling, a flattened underside, small
    barbels at the mouth and one small watchful eye set high, a dusting of grit
    clinging along its belly, hand-coloured lithograph linework and flat watercolour
    wash on the body, isolated on a plain flat pale grey studio backdrop, even soft
    light, strong crisp silhouette
voices:
  charlotte: >-
    Oh, you've spotted the loach. Most people don't. It tucks itself into the gravel
    like a letter into an envelope, such a homebody.
  wilbur: >-
    Leave its corner of gravel unraked. When it comes up, glance at the lamps and
    the clock; it keeps better time than either.
