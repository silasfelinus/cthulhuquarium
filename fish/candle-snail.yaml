  prompt: >
    a snail whose shell is a tall narrow upright white wax church candle, the shell a
    straight smooth cylinder standing vertically on the snail's back, a small warm
    orange candle flame burning at the very top of the shell with a soft glow around
    it, a few drips of melted wax running down the shell, the soft pale translucent
    snail body with two short feelers at the bottom, a single creature seen from the
    side, hand-coloured lithograph linework and flat watercolour wash on the body,
    isolated on a plain flat charcoal studio backdrop, even soft light, strong crisp
