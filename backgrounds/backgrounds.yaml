# Cthulhuquarium tank backgrounds.
#
# Silas, 2026-09-30: "real backgrounds." Until now the tank had one plate (the
# parlour) drawn under a water gradient at 82-93% opacity, so what the player
# actually saw was a dark teal wash. These are the interiors of the tank itself --
# what you see through the front glass, behind the fish.
#
# One default, plus one per economy.yaml milestone: "a milestone does not unlock a
# background; a milestone causes Charlotte to appear, and she gives you the background"
# (SYSTEMS.md). The handover lines live in story/scenes.yaml.
#
# LINEAGE (ART-DIRECTION.md "The non-fish assets"): hand-coloured lithograph, the
# plainest lineage on purpose, because these sit behind 151 different foregrounds.
# Every prompt therefore names the lithograph and keeps the midground open: the fish
# swim through the middle two-thirds of the view, so the interest lives at the floor,
# the edges and the far back, and the centre is open water.
#
# Size 1344x768 (the tank stage is 16:9). No negations (ART-DIRECTION.md rule 2).
defaults:
  size: 1344x768
backgrounds:
  - key: parlour
    name: The Parlour Tank
    unlock: default
    # Re-prompted 2026-09-30: the first render came back as a flat sandbox diorama
    # with a painter's signature scrawled in a corner, weaker than the placeholder
    # it would replace. This one leads with depth and brass, and asks for a clean
    # unsigned plate.
    prompt: >
      the deep green inside of an old Victorian parlour aquarium seen through its front
      glass, tall tarnished brass pipes and valves rising up the left side trailing strings
      of bubbles, two old brass diving helmets half sunk in pale gravel at the right, soft
      shafts of light slanting down through the water from the surface above, a bed of
      pale river gravel and cockle shells across the floor, wide open clear green water
      through the middle of the view, hand-coloured lithograph plate, fine engraved line
      under flat watercolour washes, Prussian blue and sap green water, a clean unsigned
      plate with plain margins
  - key: kelp-stair
    name: The Kelp Stair
    unlock: bestiary_5
    prompt: >
      the inside of an aquarium tank planted as a kelp forest, tall golden-brown kelp
      stalks rising from a rocky stepped floor at both edges, their fronds leaning in at
      the top, shafts of pale light falling through the surface, open clear water down
      the centre, a stone stair of flat slabs climbing the far back into the murk,
      hand-coloured lithograph plate, engraved line and flat washes of ochre, sap green
      and Prussian blue, foxed paper
  - key: sunken-pantry
    name: The Sunken Pantry
    unlock: bestiary_10
    prompt: >
      the inside of an aquarium tank furnished as a drowned Victorian pantry, shelves of
      stoppered preserving jars and blue-and-white crockery along both side walls, a
      scrubbed deal table half-sunk in silt on the floor at left, a copper pan and a
      ladle resting on the gravel, open clear green water through the middle, a small
      barred larder window glowing faintly at the back, hand-coloured lithograph plate,
      fine engraved line, flat washes of copper, delft blue and bottle green
  - key: drowned-chapel
    name: The Drowned Chapel
    unlock: bestiary_15
    prompt: >
      the inside of an aquarium tank built as a flooded village chapel, two rows of
      wooden pews receding along the silted floor, stone columns at the edges wrapped in
      weed, a tall pointed stained-glass window at the far back throwing pale coloured
      light down into the water, open water through the nave, hand-coloured lithograph
      plate, engraved line with flat washes of madder, gamboge and cold blue, foxed
      paper
  - key: wreck-of-the-portsmouth
    name: The Wreck of the Portsmouth
    unlock: bestiary_20
    prompt: >
      the inside of an aquarium tank holding the broken hull of an old wooden sailing
      ship, ribbed timbers curving up both sides, a fallen mast lying diagonally across
      the sandy floor, barrels and a ship's lantern among the ballast stones, a figurehead
      of a smiling fishwife at the right, open green water through the hold, hand-coloured
      lithograph plate, engraved line and flat washes of umber, sea green and Prussian blue
  - key: sorting-office
    name: The Sorting Office
    unlock: bestiary_25
    prompt: >
      the inside of an aquarium tank furnished as a drowned Victorian post office sorting
      room, walls of wooden pigeonholes stuffed with swollen letters at both sides, a
      red pillar box half buried in the gravel at left, parcels tied with string drifting
      on the floor, a round clock face high on the back wall, open clear water through
      the middle, hand-coloured lithograph plate, engraved line, flat washes of post-box
      red, oak brown and grey-green
  - key: counting-house
    name: The Counting House
    unlock: bestiary_35
    prompt: >
      the inside of an aquarium tank furnished as a drowned counting house, tall clerks'
      desks and stools along the side walls, stacks of green-bound ledgers on the floor,
      a brass balance scale at the right, an iron safe with its door ajar at the back
      spilling coins across the gravel, open water through the centre, hand-coloured
      lithograph plate, engraved line with flat washes of bottle green, brass and ink
