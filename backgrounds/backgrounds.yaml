  - key: flooded-conservatory
    name: The Flooded Conservatory
    unlock: bestiary_50
    prompt: >
      the inside of an aquarium tank that is a flooded Victorian glasshouse, curved
      white-painted iron ribs and panes arching overhead, drowned palms and ferns in
