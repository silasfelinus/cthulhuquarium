# Console UI art for the kind_robots front end (conductor cthulhuquarium/t-098).
#
# Rendered by scripts/render_art.py (group `ui`), cut out by scripts/build_ui.py to
# ui/built/<key>.webp, copied by kind_robots scripts/sync_cthulhuquarium_canon.mjs to
# assets/images/cthulhuquarium/ui/. The front end draws an SVG fallback at the same
# size until each file exists.
#
# Same rules as every canon prompt (ART-DIRECTION.md): concrete nouns, no negations,
# no similes, no format words (poster, frame, card art). Each item is one object on a
# flat backdrop so the cut-out can key against it.
defaults:
  size: 1024x1024
  long_edge: 256
  suffix: >-
    a single object centred with space around it, vivid painted illustration for a dark comedy video game, bold readable shapes, crisp inked outlines, rich saturated jewel-tone colour, glowing bioluminescent accents, painterly texture, isolated on a plain flat pale grey
    studio backdrop, even soft light, strong crisp silhouette
items:
  - key: tab-tank
    prompt: >-
      a small rectangular glass aquarium tank with blackened iron corners and brass rivets, sea-green
      water inside with two fronds of weed and one small orange fish, seen at a slight three-quarter angle
  - key: tab-feed
    prompt: >-
      a shallow round verdigris brass bowl heaped with glossy amber food pellets, three pellets spilled
      beside it, seen at a slight three-quarter angle
  - key: tab-creatures
    prompt: >-
      a small eldritch octopus with curling violet and plum tentacles, a ring of tiny pale eyes around its
      mantle, sitting upright, its tentacles coiled beneath it
  - key: tab-relics
    prompt: >-
      a weathered square stone tablet with chipped edges, an engraved open eye sigil at its centre inlaid
      with tarnished gold, verdigris in the carved lines, a few barnacles on one corner
  - key: tab-market
    prompt: >-
      a small market stall with a striped oxblood and bone canopy, two hanging brass lanterns glowing amber,
      a counter stacked with tiny jars and a glass globe holding a fish
  - key: coin
    long_edge: 128
    prompt: >-
      one old gold coin seen face on, thick worn rim, an embossed open eye at its centre ringed by small
      tentacle scrollwork, warm gold with darker tarnish in the recesses
  - key: plinth
    size: 1216x832
    long_edge: 384
    prompt: >-
      a short round pedestal of dark carved stone with a polished brass band around its top edge and a
      ring of carved tentacle scrollwork around its base, flat empty top, seen slightly from above
  - key: corner-ornament
    long_edge: 320
    prompt: >-
      an ornamental corner piece of gilt brass scrollwork shaped into an L, curling tentacles and kelp
      fronds twisting along both arms, a small round boss with an engraved eye where the arms meet
  - key: meter-hunger
    long_edge: 96
    prompt: >-
      a small brass fork and spoon crossed over a round verdigris disc
  - key: meter-clean
    long_edge: 96
    prompt: >-
      a small brass scrub brush with pale bristles over a round verdigris disc, three tiny bubbles above it
  - key: meter-mood
    long_edge: 96
    prompt: >-
      a small oxblood glass heart with a gold rim over a round verdigris disc
  - key: capacity
    long_edge: 96
    prompt: >-
      a tiny glass aquarium tank with brass corners, sea-green water and a few weed fronds, seen face on
  - key: day-moon
    long_edge: 96
    prompt: >-
      a pale crescent moon of hammered silver with a small engraved eye in its curve
  # Tank decorations (kind_robots DECOR_CATALOG), drawn on the tank floor and in the Relics shop.
  # They replace the emoji the tank drew until now (conductor cthulhuquarium/t-110).
  - key: decor-pebble-bed
    long_edge: 192
    prompt: >-
      a low scatter of seven smooth rounded river pebbles in slate grey, sandstone and pale green,
      lying together on a patch of fine sand, seen from a slight angle above
  - key: decor-driftwood
    long_edge: 192
    prompt: >-
      a weathered branch of pale silver-grey driftwood lying on its side, sanded smooth by water,
      two forked limbs reaching up, a tuft of green moss in one crook
  - key: decor-coral-spire
    long_edge: 192
    prompt: >-
      one tall slender spire of bright coral in crimson and coral pink, branching near the top
      into three knobbed tips, rising from a small rocky base
  - key: decor-sunken-chest
    long_edge: 192
    prompt: >-
      a small iron-banded wooden treasure chest with its lid shut and a heavy brass padlock,
      crusted with white barnacles and green weed, half settled into sand
  - key: decor-glow-kelp
    long_edge: 192
    prompt: >-
      a single tall frond of kelp with long ribbon leaves rising from a holdfast on a pebble,
      its leaves glowing a soft bioluminescent sea green along their edges
  - key: decor-ceramic-ruin
    long_edge: 192
    prompt: >-
      half a small glazed ceramic castle turret in cream and cobalt blue, cracked open on one
      side, its crenellations chipped, soft moss growing over the broken edge
  # The Roaming Collector set piece, which patrols the tank picking up coins.
  - key: swimmer-collector
    long_edge: 160
    prompt: >-
      a small clockwork brass crab automaton with a round coin drum on its back with a slot in
      the lid, two glass lens eyes on stalks, riveted brass claws held up ready, little winding
      key at its side, seen from the side facing right
