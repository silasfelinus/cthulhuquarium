# Cthulhuquarium -- barks: the short lines Charlotte and Wilbur say on a screen or after
# an action. These are the "select screens" SYSTEMS.md (2026-08-24) promised: characters
# appear at the beginning (story/scenes.yaml intro), at select screens (this file), and
# at milestone interstitials (story/scenes.yaml milestone_*).
#
# This file is the canon. kind_robots renders it (mirrored there by
# scripts/sync_cthulhuquarium_canon.mjs -- regenerate it, never edit the mirror directly).
#
# SHAPE
#   barks.<context>.speaker  charlotte | wilbur (one speaker per context)
#   barks.<context>.pose     default portrait pose (see POSES)
#   barks.<context>.lines[]  one line is picked per appearance; each is one or two
#                            sentences, at most 22 words, and written for its context
#
# POSES (characters/*.yaml, art: portraits):
#   charlotte: welcome, delighted, presenting, confiding, lorgnette
#   wilbur:    greeting, explaining, wince, hopeful, alarmed
#
# VOICE RULES (DESIGN-BRIEF.md decision 5 -- hard rules, same as scenes.yaml):
#   - Charlotte is dreadfully cheerful, sincerely and without a crack. She presents and
#     sells; she never explains. She never mentions Wilbur's injuries.
#   - Wilbur is earnest, competent, kind, and the only one who understands the tanks. He
#     never complains and never mentions his injuries. The joke lands on the situation or
#     on Charlotte, never on him. His stutter is characterisation, never the joke, and
#     appears in at most two lines in this whole file. No exclamation marks from Wilbur.
#   - Outside is never shown, named, dated, or explained. Nobody asks about it.
#   - Nobody hints at the finale -- no winks at the glass, at being watched, or at who is
#     kept. Nobody references the book their names come from. "The book" / "the register"
#     here means the Ichthyonomicon, and only that.
#   - Short. A voice that speaks too often becomes a tooltip.

barks:
  shop:
    speaker: charlotte
    pose: presenting
    lines:
      - Fresh stock this morning, darling. Fresh to us, at any rate; most of it is considerably older than the building.
      - Browse as long as you like. Nothing on these shelves is going anywhere, which is rather the charm of it.
      - We rotate the stock regularly. Some of it rotates on its own, but we do like to help.
      - Every creature comes with the Fishmongers' personal guarantee that it is exactly what it is.
      - Take your time. I never hurry a customer, and nothing in this shop has ever hurried me.
      - That one arrived only yesterday, in a crate nobody ordered. Such a lovely surprise; we kept the crate as well.
      - If you can't decide, buy both. Indecision is so terribly bad for the complexion.
      - We have been restocking since before you came in, and we shall be restocking long after tea. Isn't that reassuring?
      - The Portsmouth Fishmongers have never turned a single creature away. Something always comes of it.
      - Everyone lingers at that shelf, darling. Nobody has ever been able to tell me why.
      - Everything is for sale, darling, everything. I have never once been sentimental about stock.
      - A new face on the top shelf, or a new arrangement of faces. It's settling in beautifully.

  eggs:
    speaker: charlotte
    pose: presenting
    lines:
      - A common egg, darling. Common because everyone adores them, and because they simply will not stop arriving.
      - An uncommon egg. A little warmer than the others, and a little smug about it.
      - A rare egg; hold it to your ear, if you like. Most people only do that the once.
      - An epic egg. It came with a great deal of paperwork, and I had all of it burned; so much tidier.
      - A legendary egg. We keep it on velvet; it refuses anything less, and who are we to argue?
      - Our mythic egg. Nobody is quite sure who laid it, and I think that is terribly romantic.

  sets:
    speaker: charlotte
    pose: presenting
    lines:
      - A proper filter, darling. Everything goes through it, and nothing has ever come back out to complain.
      - The heater. It keeps the water exactly as warm as they like it, which is warmer than you'd think.
      - A good lamp makes all the difference. The colours come up beautifully, and one or two new colours besides.
      - The bubbler, pure theatre. Every tank deserves an overture.
      - A matched set, darling. They were made to go together, and they will not be parted.
      - Our very first pump is still running. It was never plugged in, and it has never once needed to be.

  decor:
    speaker: charlotte
    pose: lorgnette
    lines:
      - A little castle. Every tank should have somewhere to retreat to, and a castle is by far the most dignified option.
      - Ornamental kelp. It needs no light and no feeding, and it has never needed anything from anyone.
      - The sunken chest is purely decorative, darling. Please don't open it; it is purely decorative.
      - A little stone arch. Things swim through it and come out the other side, generally looking pleased.
      - Decor is how a tank says who it belongs to. Yours ought to say it loudly.
      - Real coral, darling, and a reef once. Now it is a centrepiece, which is a promotion.

  upgrades:
    speaker: charlotte
    pose: delighted
    lines:
      - Better food, darling. Richer, fresher, and it struggles a great deal less on the way down.
      - Faster drops. The coins come up quicker, and I do like to see a tank that is keen.
      - Our premium feed, the very best we have. It was extremely well brought up.
      - An improvement, how marvellous. Everyone downstairs will notice, and everyone downstairs is very hard to impress.
      - Nothing here ever wears out, darling. We simply wouldn't allow it.
      - Think of it as an investment in their happiness. Their happiness pays out beautifully.

  sell:
    speaker: charlotte
    pose: delighted
    lines:
      - Sold back to the house, lovely. It will be in somebody else's tank by teatime, and ever so happy.
      - Back it comes. The shelf had been missing it terribly, and the shelf is so rarely wrong.
      - A wonderful price. I would have paid double, frankly, but it would be rude to say so.
      - No fretting, darling; nothing that comes through this shop is ever really gone. It only changes tanks.
      - Thank you, darling. I shall put it straight back in the window; it knows the way.

  backgrounds:
    speaker: charlotte
    pose: confiding
    lines:
      - Choose a backdrop, darling. Every creature deserves a setting, and every setting deserves a creature or two.
      - Each of these rooms was mine once. They are far better used now.
      - The Chapel is popular, and the Opera House more so. I shan't say which I prefer, but I sang in one.
      - Change it as often as you please. The rooms don't mind, and the ones still living in them have stopped mentioning it.
      - A good backdrop sets off the stock beautifully, the way black silk sets off pearls.

  bestiary:
    speaker: wilbur
    pose: explaining
    lines:
      - Every species you've kept is in here. I write them up the evening they arrive, while the details are fresh.
      - The book doesn't let you rub anything out. I tried once, for a spelling mistake, and it's still there.
      - The blank pages aren't missing anything. They're species you haven't met yet.
      - I keep the care notes short. If you need more than a paragraph, come and find me.
      - The pages near the back are heavier than the ones at the front. I turn them slowly.
      - If a page looks damp, close the book and give it an hour. It usually settles.
      - It's the register of everything that's been kept here. I add to it; I've never taken anything out.
      - The field notes aren't mine; they were in the book before I was. I just keep them tidy.
      - The book tends to fall open at the page you need. It's helpful like that, most days.
      - The drawings are mine, and I get the fins right. The eyes I do last, when they're asleep.

  fed:
    speaker: wilbur
    pose: hopeful
    lines:
      - That's them fed. Listen to that; that's contentment, mostly.
      - Everyone got some. The quick ones got more, but everyone got some.
      - Watch the one in the corner; it waits until the others have finished. Manners, I think.
      - They'll settle in a minute. The food settles a little sooner.
      - That was the right amount. You're getting a feel for it.
      - The food went in wriggling and nothing came back up wriggling. That's a clean feed.
      - Nicely done. A fed tank is a calm tank, and a calm tank is one I can leave till morning.
      - Don't overdo it; they'll always act hungry. Some of them are only being polite.
      - They're eating well, so I'll put it in the log. I like writing good days in the log.
      - Did you see the big one wait its turn? It never used to, and you've done that.

  cleaned:
    speaker: wilbur
    pose: hopeful
    lines:
      - That's better. They can see each other properly again, which is mostly good.
      - All swept up. Most of it was gravel, and I've bagged the rest separately.
      - Clean glass, clean gravel. The coins come up quicker now; I don't know why, but they always do.
      - Nice work. Everything on the bottom is back where it belongs, or at least somewhere I can find it.
      - There were teeth in that lot, not from anyone we've got. I'll keep them in a jar.
      - Leave the bit of scum on the far side. Something's laid in it, and I'd rather it hatched first.
      - That's the bottom back to gravel. It won't last, it never does, and that's all right.
      - The water's so clear you can see the shy ones now. They're doing fine.

  hungry:
    speaker: wilbur
    pose: explaining
    lines:
      - One of them's getting hungry, nothing to worry about yet. Feed when you're ready.
      - That one's circling the surface, which means hungry. Press Feed and it'll be seen to first.
      - Someone's peckish. If you've got a moment, they'll be glad of it.
      - It's hungry, not cross. It'll be cross in a while, and now is nicer.
      - See the one nosing at the lid? It isn't trying to get out; it's asking.
      - A-a hungry one's started following the food tin around. Best not keep it waiting too long.

  rare_event:
    speaker: wilbur
    pose: alarmed
    lines:
      - Did you see that? I'll write it down exactly as it happened, and then not read it back.
      - That isn't in the book. I'll put it in the book.
      - Everyone's fine, I counted. There's one more than there was, but everyone's fine.
      - The water went still and they all faced the back wall. It's passed now, I think.
      - I've heard of that happening. I hadn't heard of it happening here.
      - Nobody touch the gravel for a bit. It's arranged itself into something, and I want to copy it down first.
      - It's all right, that happens. Not often, and never to this tank before, but it happens.
      - That light came from the bottom of the tank. There's nothing at the bottom of the tank, but I'll check again.

  startle:
    speaker: wilbur
    pose: wince
    lines:
      - They've scattered, but they'll come back. It's best to let them decide when.
      - Tapping makes them jumpy, and the jumpy ones remember. A slow wave works better.
      - They're only startled. That one's pretending to be a rock, and it's quite good at it.
      - Give them a minute; the small ones come back first. The big one comes back when it's ready.
      - I know it's tempting. I tapped once, my first week, and it tapped back.
      - Th-they're fine. Just keep your face a little way back from the front for a moment.

  welcome_back:
    speaker: charlotte
    pose: welcome
    lines:
      - There you are, come in. The tank kept perfectly well without you, and it kept count.
      - Welcome back, darling. The coins have been piling up out of sheer good manners.
      - You came back; I knew you would. I had your tank dusted.
      - Out of all that and in where it's warm. Your earnings are just where you left them, and then some.
      - Everything is exactly as you left it, darling, only richer. That is our whole philosophy.
      - Nothing happened while you were gone, darling. Nothing ever happens here, and it pays wonderfully.
      - Back again. The coins came up the whole while you were away, and not one of them tried to leave.
      - Don't tell me where you've been, darling; I shan't ask. Collect your coins and choose something nice.

  idle:
    speaker: wilbur
    pose: hopeful
    lines:
      - It's nice, just watching them. I don't get to much; I'm usually on the other end of the net.
      - The little one does a lap every eleven minutes; I've timed it. It's never late.
      - A quiet tank is the best sort. You can hear the filter thinking.
      - If you watch long enough they sort themselves into a pattern. I've never seen the same one twice.
      - That one's asleep. Don't let the eyes fool you; they don't close.
      - I like this part of the day. Nothing needs feeding, nothing needs cleaning, and everything is where I left it.
      - You're good at this, sitting with them. Not everyone can.
      - The bubbles are going up in threes today, and yesterday it was fours. I've written both down.
