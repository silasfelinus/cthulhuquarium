# Scene plates shown above the dialogue in story/scenes.yaml (`plate:`).
# Lineage: the screens' carte-de-visite interior view (ART-DIRECTION.md, "The non-fish
# assets") -- the same stock as screen-shop and screen-bestiary, so the finale's plate,
# which uses it too, arrives in a register the player already trusts.
plates:
  - key: screen-arrival
    size: 1344x768
    prompt: >-
      interior view of a cramped Victorian curiosity shop seen from just inside its front
      door, rain streaming down the door's glass panes at the edges of the view, a
      dripping umbrella stand, a long aisle of glowing murky green aquarium tanks
      stretching away into warm gaslight, stuffed fish in glass cases on the walls, far
      down the aisle a tall woman in a black gown with a towering white pompadour raising
      one arm in welcome, long exposure stillness, the slightly converging verticals of a
      wide plate camera, hand-tinted albumen carte-de-visite photograph, warm sepia, deep
      blacks, painted green tint in the tanks

  # Purchasables take the set-piece lineage (ART-DIRECTION.md "The non-fish assets"):
  # a Victorian trade-catalogue engraving, drawn to sell rather than to describe.
  - key: upgrade-food
    size: 1024x1024
    prompt: >-
      a squat Victorian tin of aquarium feed with an ornate embossed lid prised
      half open, fat glossy grubs heaped inside and one climbing over the rim, a small
      brass measuring scoop resting against it, Victorian trade-catalogue engraving,
      fine line engraving with hatched shading, isolated on white paper with a blank
      catalogue margin beneath
  - key: upgrade-drops
    size: 1024x1024
    prompt: >-
      an ornate brass clockwork feeding hopper with a crank handle and a fluted spout,
      a governor of spinning brass balls on top, a stream of small pellets tumbling
      from the spout, Victorian trade-catalogue engraving, fine line engraving with
      hatched shading, isolated on white paper with a blank catalogue margin beneath
  - key: set-peace-ward
    size: 1024x1024
    prompt: >-
      a small ornate brass aquarium partition screen of pierced fretwork panels on
      hinged feet, a tiny engraved olive branch on its central panel, Victorian
      trade-catalogue engraving, fine line engraving with hatched shading, isolated on
      white paper with a blank catalogue margin beneath

  # First wave of 2026-10-23 visual-novel production: the dialogue alone
  # already exists; these wide plates let it occupy an illustrated screen.
  # The canonical character sheets own clothing/identity. Portrait hero
  # plates and cut-out poses remain separately queued in characters/*.yaml.
  - key: screen-first-unlock
    size: 1344x768
    prompt: >-
      Wide interior of a crowded Victorian aquarium curiosity shop at the
      moment of the first purchase, a grand elderly gothic prima donna
      proprietress with towering silver-white pompadour and high-necked
      black mourning gown theatrically unveiling a tiny glass specimen
      tank on a polished counter, beside her an anxious stooped assistant
      with long thinning hair, round taped spectacles and a plaster cast
      cradling the specimen with his good hand, dozens of strange green
      aquariums glowing in the dark behind them, hand-tinted albumen
      carte-de-visite interior photograph, gaslight, sepia silver halides,
      painted emerald on the glass, wide studio plate framing

  - key: screen-first-hatch
    size: 1344x768
    prompt: >-
      Wide close interior photograph of a cramped gaslit Victorian fish
      hatchery, a translucent irregular egg splitting in a shallow glass
      nursery tank, a tiny unfamiliar aquatic creature emerging amid
      luminous water droplets, a long-haired balding bespectacled keeper
      in a bandaged forearm cast watching with earnest attention and a
      hand-written clipboard resting beside the glass, towering ranks
      of opaque green bottles and fragile brass plumbing behind,
      hand-tinted albumen carte-de-visite studio photograph with period
      long-exposure stillness, warm sepia, fine grain, pale moss tint

  - key: screen-first-breed
    size: 1344x768
    prompt: >-
      A Victorian specimen aquarium seen across its entire glass front,
      two improbable fish sheltering a third tiny new creature among
      twisting kelp and porcelain cave ornaments, a weary injured
      bespectacled keeper with one arm in plaster recording what he
      sees on a clipboard, behind him an elderly black-gowned prima
      donna with a theatrical white pompadour smiling in delight,
      watery green illumination spilling across the floorboards,
      hand-tinted albumen carte-de-visite photographic interior
      from a wide plate camera, warm sepia and deep gallery shadows

  - key: screen-bestiary-complete
    size: 1344x768
    prompt: >-
      The final page of an enormous hand-bound Victorian ichthyological
      scrapbook opened upon an oak reading table, hundreds of little
      specimen lithographs mounted across the spread with hand-lettered
      inventory tags, an elderly black-gowned white-pompadoured gothic
      proprietress standing proud at the desk and a long-haired
      bespectacled injured assistant beside her, warm green lamplight
      catching the book's gilded edges while the museum shelves fade
      into ink-darkness, hand-tinted albumen carte-de-visite wide
      interior photograph, fine plate-grain and subtle sepia tint

  - key: screen-milestone-kelp-stair
    size: 1344x768
    prompt: >-
      A mysterious aquarium chamber revealed behind heavy Victorian
      velvet curtains, a submerged wrought-iron staircase curling
      through wavering kelp toward dim green water below, the grand
      elderly gothic proprietress with silver-white pompadour and
      black mourning silk unveiling this inheritance with an open
      gloved hand, painted light on the glass and dripping stone,
      wide antique carte-de-visite photographic interior,
      hand-tinted albumen paper, sepia shadows and Prussian green

  - key: screen-milestone-portsmouth
    size: 1344x768
    prompt: >-
      The wreck of an old Portsmouth merchant ship laid out as a
      huge aquarium panorama, broken dark timber ribs and a rusting
      brass ship's bell covered in weeds, luminous strange specimen
      fish swimming between sealed cargo crates, seen from a dry
      Victorian observation gallery framed with gothic arches, an
      elderly black-gowned white-pompadoured proprietress presenting
      the view with an eel-headed cane, hand-tinted albumen
      carte-de-visite wide interior photograph, grainy sepia paper,
      painted aquamarine and antique gaslight

  - key: screen-milestone-hatchery
    size: 1344x768
    prompt: >-
      A broad Victorian fish hatchery of glass shelves and green
      nursery tanks, the silhouette of an altered specimen with
      oddly expanded fins appearing behind wet glass beside the
      shell it outgrew, a careful stooped aquarium keeper with
      long thinning hair, round cracked spectacles, bandaged
      fingers and one forearm in plaster studying the creature
      beside his handwritten notebook, a grand silver-haired
      gothic proprietress watching from the far doorway,
      hand-tinted albumen carte-de-visite photographic interior,
      pale copper lamp glow, deep blacks, painted sea-green glass
