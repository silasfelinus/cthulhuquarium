# Scene plates shown above the dialogue in story/scenes.yaml (`plate:`).
# Lineage: the screens' carte-de-visite interior view (ART-DIRECTION.md, "The non-fish
# assets") -- the same stock as screen-shop and screen-bestiary, so the finale's plate,
# which uses it too, arrives in a register the player already trusts.
plates:
  - key: screen-arrival
    size: 1344x768
    prompt: >-
      interior view of a cramped Victorian curiosity shop seen from just inside its front
      door, rain streaming down the door's glass panes at the edges of the view, a
      dripping umbrella stand, a long aisle of glowing murky green aquarium tanks
      stretching away into warm gaslight, stuffed fish in glass cases on the walls, far
      down the aisle a tall woman in a black gown with a towering white pompadour raising
      one arm in welcome, long exposure stillness, the slightly converging verticals of a
      wide plate camera, hand-tinted albumen carte-de-visite photograph, warm sepia, deep
      blacks, painted green tint in the tanks

  # Purchasables take the set-piece lineage (ART-DIRECTION.md "The non-fish assets"):
  # a Victorian trade-catalogue engraving, drawn to sell rather than to describe.
  - key: upgrade-food
    size: 1024x1024
    prompt: >-
      a squat Victorian tin of aquarium feed with an ornate embossed lid prised
      half open, fat glossy grubs heaped inside and one climbing over the rim, a small
      brass measuring scoop resting against it, Victorian trade-catalogue engraving,
      fine line engraving with hatched shading, isolated on white paper with a blank
      catalogue margin beneath
  - key: upgrade-drops
    size: 1024x1024
    prompt: >-
      an ornate brass clockwork feeding hopper with a crank handle and a fluted spout,
      a governor of spinning brass balls on top, a stream of small pellets tumbling
      from the spout, Victorian trade-catalogue engraving, fine line engraving with
      hatched shading, isolated on white paper with a blank catalogue margin beneath
  - key: set-peace-ward
    size: 1024x1024
    prompt: >-
      a small ornate brass aquarium partition screen of pierced fretwork panels on
      hinged feet, a tiny engraved olive branch on its central panel, Victorian
      trade-catalogue engraving, fine line engraving with hatched shading, isolated on
      white paper with a blank catalogue margin beneath

  # First wave of 2026-10-23 visual-novel production: the dialogue alone
  # already exists; these wide plates let it occupy an illustrated screen.
  # The canonical character sheets own clothing/identity. Portrait hero
  # plates and cut-out poses remain separately queued in characters/*.yaml.
  - key: screen-first-unlock
    size: 1344x768
    prompt: >-
      wide interior of a crowded Victorian aquarium curiosity shop lit
      by gaslight, behind a polished wooden counter a tall old woman
      with a towering silver-white pompadour, kohl-rimmed eyes and
      oxblood lips, in a high-necked black silk mourning gown with
      leg-of-mutton sleeves and black lace gloves lifts a black silk
      cloth off a small glass specimen tank with one gloved hand raised
      high, a small bright orange fish inside the tank, beside her a
      gangly stooped young man with long lank brown hair around a bald
      crown, round wire spectacles with one taped lens, his right arm in
      a white plaster cast and sling and bandages on his nose and chin
      steadies the tank with his left hand, dozens of murky green
      aquariums glowing on shelves in the dark behind them, hand-tinted
      albumen carte-de-visite photograph, warm sepia and deep blacks,
      painted emerald tint on the tank glass

  - key: screen-first-hatch
    size: 1344x768
    prompt: >-
      close interior view of a cramped gaslit Victorian fish hatchery, a
      translucent pale green egg split open in a shallow glass nursery
      tray, a tiny pink finned creature with oversized eyes wriggling
      out among water droplets, a gangly stooped young man with long
      lank brown hair around a bald crown, round wire spectacles with
      one taped lens, his right arm in a white plaster cast and sling
      and bandages on his nose and chin bending close over the tray with
      a clipboard in his left hand, tall shelves of green glass bottles
      and thin brass pipes behind him, hand-tinted albumen
      carte-de-visite photograph, warm sepia, fine grain, pale
      moss-green tint

  - key: screen-first-breed
    size: 1344x768
    prompt: >-
      a Victorian specimen aquarium seen straight on through its glass
      front, two large spotted fish, one blue and one gold, hovering on
      either side of a tiny new fish striped blue and gold among
      twisting kelp and white porcelain cave ornaments, in front of the
      tank a gangly stooped young man with long lank brown hair around a
      bald crown, round wire spectacles with one taped lens, his right
      arm in a white plaster cast and sling and bandages on his nose and
      chin writes on a clipboard propped on his cast, behind him a tall
      old woman with a towering silver-white pompadour, kohl-rimmed eyes
      and oxblood lips, in a high-necked black silk mourning gown with
      leg-of-mutton sleeves and black lace gloves clasps her hands at
      her breast and smiles, green light from the tank spilling across
      bare floorboards, hand-tinted albumen carte-de-visite photograph,
      warm sepia and deep shadows

  - key: screen-bestiary-complete
    size: 1344x768
    prompt: >-
      an enormous hand-bound Victorian scrapbook lying open on an oak
      reading table, hundreds of small coloured fish engravings pasted
      in neat rows across both pages, gilded page edges catching warm
      green lamplight, a tall old woman with a towering silver-white
      pompadour, kohl-rimmed eyes and oxblood lips, in a high-necked
      black silk mourning gown with leg-of-mutton sleeves and black lace
      gloves standing at the table with one gloved hand resting on the
      open book, beside her a gangly stooped young man with long lank
      brown hair around a bald crown, round wire spectacles with one
      taped lens, his right arm in a white plaster cast and sling and
      bandages on his nose and chin smiling shyly, tall dark bookshelves
      receding behind them into shadow, hand-tinted albumen
      carte-de-visite photograph, fine grain, warm sepia tint

  - key: screen-milestone-kelp-stair
    size: 1344x768
    prompt: >-
      an aquarium room behind heavy red velvet curtains drawn back to
      either side, a wrought-iron spiral staircase descending through
      tall swaying golden-brown kelp into dim green water, water
      droplets running down wet stone walls, a tall old woman with a
      towering silver-white pompadour, kohl-rimmed eyes and oxblood
      lips, in a high-necked black silk mourning gown with leg-of-mutton
      sleeves and black lace gloves standing beside the curtain with one
      gloved arm extended palm up toward the staircase, hand-tinted
      albumen carte-de-visite photograph, sepia shadows, painted
      Prussian green on the water

  - key: screen-milestone-portsmouth
    size: 1344x768
    prompt: >-
      the broken hull of an old wooden sailing ship lying in a huge
      aquarium tank, dark timber ribs, a rusting brass ship's bell
      covered in weed, small glowing blue and orange fish swimming
      between sealed cargo crates, seen from a dry Victorian viewing
      gallery with pointed stone arches, a tall old woman with a
      towering silver-white pompadour, kohl-rimmed eyes and oxblood
      lips, in a high-necked black silk mourning gown with leg-of-mutton
      sleeves and black lace gloves standing in the gallery with one
      hand on a silver cane with an eel's head handle and the other
      raised toward the wreck, hand-tinted albumen carte-de-visite
      photograph, grainy sepia, painted aquamarine water, gaslight

  - key: screen-milestone-hatchery
    size: 1344x768
    prompt: >-
      a long Victorian fish hatchery of glass shelves and green nursery
      tanks, in the nearest tank a grown fish with wide fan-shaped fins
      spread beside the cracked empty shell it hatched from, a gangly
      stooped young man with long lank brown hair around a bald crown,
      round wire spectacles with one taped lens, his right arm in a
      white plaster cast and sling and bandages on his nose and chin
      bending close to the tank with a handwritten notebook open in his
      left hand, a tall old woman with a towering silver-white
      pompadour, kohl-rimmed eyes and oxblood lips, in a high-necked
      black silk mourning gown with leg-of-mutton sleeves and black lace
      gloves watching from a far doorway, pale copper lamplight,
      hand-tinted albumen carte-de-visite photograph, deep blacks,
      painted sea-green tint on the glass
